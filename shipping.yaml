- name: configuring shipping server
  hosts: shipping 
  become: yes
  tasks: 
  - name: Install maven
    ansible.builtin.dnf:
      name: maven
      state: installed
    
  - name: Install PyMySQL
    ansible.builtin.pip:
      name: PyMySQL
      executable: pip3.9

  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: create a system user    
    ansible.builtin.user:
      name: roboshop
      shell: /sbin/nologin
      system: true
      home: /app    

  - name: download shipping code
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip 
      dest: /tmp/shipping.zip   

  - name: extract shipping code
    ansible.builtin.unarchive:
      src: /tmp/shipping.zip
      dest: /app  
      remote_src: yes        

  - name: install maven dependecies
    ansible.builtin.command: mvn clean package 
    args:
      chdir: /app     

  - name: rename jar file 
    ansible.builtin.command:  mv target/shipping-1.0.jar shipping.jar 
    args: 
      chdir: /app

  - name: copy shipping service
    ansible.builtin.copy:
      src: shipping.service
      dest: /etc/systemd/system/shipping.service

  - name: daemon and reload service
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: start and enable service
    ansible.builtin.service:
      name : shipping
      state : started
      enabled: yes

  - name: install mysql client
    ansible.builtin.dnf:
      name: mysql
      state: installed

  - name: connect to MySQL using app user
    community.mysql.mysql_info:
      login_user: shipping
      login_password: RoboShop@1
      login_host: mysql.vkr01.shop
      login_db: cities


